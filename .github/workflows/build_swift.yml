name: build_swift

# Pull requests only (and by hand); pushes don't build.
on:
  pull_request:
    # The Swift app only; QCBuddy (windows/) has its own checks in qcbuddy-ci.yml.
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Tests/**"
      - "build.sh"
      - "package.sh"
      - "Makefile"
      - ".github/workflows/build_swift.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make build
      - name: Package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: BoseBuddy
          path: dist/release/
