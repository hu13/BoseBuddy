name: macOS release

# Builds the QCBuddy Tauri app for macOS (universal: Apple silicon and Intel)
# as a .dmg installer.
#
# - qcbuddy-release.yml calls it after creating the draft release, so every
#   qcbuddy-v* draft also gets QCBuddy_X.Y.Z_universal.dmg.
# - Run it by hand (Actions → Run workflow) with no tag for a test DMG, a
#   workflow artifact only; with a tag like qcbuddy-v0.1.3 it builds that tag
#   and attaches the DMG to its release (draft or published).
#
# Signing: with the APPLE_CERTIFICATE secrets set, the app is signed with that
# Developer ID, and with the APPLE_ID secrets too it's notarized. Without
# them the app is ad-hoc signed: it runs, but Gatekeeper blocks the first
# launch until it's allowed in System Settings → Privacy & Security.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the DMG to, e.g. qcbuddy-v0.1.3"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (blank: this branch, artifact only)"
        type: string
        required: false

permissions:
  contents: write

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  dmg:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            windows/core
            windows/app/src-tauri
          key: ${{ hashFiles('.github/workflows/macos-release.yml') }}

      - name: Validate the version
        id: version
        run: |
          version="$(jq -r .version windows/app/src-tauri/tauri.conf.json)"
          if [[ -n "$TAG" && "$TAG" != "qcbuddy-v$version" ]]; then
            echo "::error::Tag $TAG doesn't match tauri.conf.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Core tests
        working-directory: windows/core
        run: cargo test

      - name: App tests
        working-directory: windows/app
        run: |
          npm ci
          npm test
          (cd src-tauri && cargo test)

      - name: Signing identity
        # Only export what's set: Tauri treats an empty APPLE_CERTIFICATE as
        # a certificate to import.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "Signing with $APPLE_SIGNING_IDENTITY and notarizing."
            else
              echo "::warning::APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID isn't set; the app is signed but not notarized."
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE secrets aren't set; the app is ad-hoc signed and Gatekeeper will block its first launch."
          fi

      - name: Build the DMG
        working-directory: windows/app
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Name it and checksum it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          built="windows/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/QC Buddy_${VERSION}_universal.dmg"
          cp "$built" "dist/QCBuddy_${VERSION}_universal.dmg"
          (cd dist && shasum -a 256 *.dmg | tee SHA256SUMS-macos.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: qcbuddy-macos-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS-macos.txt --repo "${{ github.repository }}" --clobber
